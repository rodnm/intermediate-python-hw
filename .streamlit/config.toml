# Tema de tarea_1/app.py con la paleta del proyecto (tarea_1/paleta.py): rampa de #003d5c a #ffa600,
# negro #242424 y blanco #fcfcfc. Streamlit Community Cloud solo lee este archivo en la raíz del repositorio,
# por eso la app se ejecuta desde aquí:
#   streamlit run tarea_1/app.py

[theme]
base = "dark"
primaryColor = "#a14e9a"               # acento neutral, ni el rojo de LR ni el amarillo de EC (texto blanco 5.0:1)
backgroundColor = "#242424"            # negro del proyecto
secondaryBackgroundColor = "#003d5c"   # widgets
textColor = "#fcfcfc"                  # blanco del proyecto (15:1)
linkColor = "#ff7a47"
borderColor = "#31497e"
dataframeBorderColor = "#31497e"
dataframeHeaderBackgroundColor = "#003d5c"

# Plotly: series únicas en #d44c8d; los medios usan COLORES_MEDIO de tarea_1/paleta.py
chartCategoricalColors = ["#d44c8d", "#ff7a47"]

[theme.sidebar]
backgroundColor = "#003d5c"
secondaryBackgroundColor = "#31497e"
